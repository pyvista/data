format, and that record names itself. `head -c 160 Data/SainteHelens.dem`
gives:

    MOUNT ST. HELENS, WASH. (POST-ERUPTION)  MSH-M80  3-176 09/06/80  B-8
    N=2.00X1.00 S=2.00X1.00MM 9 PANEL FILES 30M X 30M INTERVAL

So the quadrangle, the vintage and the grid spacing were in the bytes all
along. A digital elevation model prepared by the USGS is a work of the United
States federal government and carries no copyright under 17 U.S.C. Sec. 105.
It was recorded here under Kitware's blanket collection notice, which cannot
attach a copyright to a work that has none.
"""

