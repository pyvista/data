[[dataset]]
name = "wavy_pvd"
title = "Wavy surface animation"
description = "Fifteen-frame animation of a radial sine surface on an 80 by 80 structured grid, in ParaView PVD collection format."
path = ["PVD/wavy.zip"]
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = ["PyVista Developers"]
provenance = "verified"
origin_url = "https://github.com/pyvista/data/pull/3"
origin_title = "PyVista"
attribution = "Generated with PyVista, MIT License."
notes = """
Generated data, not ParaView's. The pull request that added it publishes the
PyVista script that wrote the frames: a `pv.StructuredGrid` over
`numpy.arange(-10, 10, 0.25)` in x and y, with `z = sin(r + phase)` sampled
at fifteen phases. The grids here are 80 by 80 with a single `z` point array
ranging over -1 to 1, which is what that script produces.

It sat under `PVD/` beside the files taken from ParaView and was covered by
their entry until the two were separated.
"""

