title = "Turbine blade"
description = "Scan of a turbine blade, Laser Design's ZS-Series inspection sample."
path = ["turbineblade.ply"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "https://www.laserdesign.com/sample-files/blade/"
origin_title = "Laser Design sample files: Turbine Blade"
collection = "laser-design"
redistributed_from = ["http://3dgallery.gks.com/2012/blade/blade.php"]
modified = true
modification = "The file Laser Design serves for this sample is a binary STL written by Geomagic Studio with 1499981 triangles; this copy is a VTK-written PLY of 99519 points and 199034 triangles, so it was converted and decimated. Who did so, and when, was not recorded."
notes = """
Laser Design Inc. publishes this scan to demonstrate its scanning services on
its own page, "Turbine Blade. Type: .STL, Inspection, ZS-Series", whose
Download link is http://3dgallery.gks.com/2012/blade/blade.php. PyVista's
2019 loader `download_turbine_blade` (pyvista commit 8876d784e) fetched
`turbine_blade.stl` from that link; when the gallery went offline the file
was re-hosted here from contributors' caches as `turbineblade.ply`
(https://github.com/pyvista/pyvista/pull/1226, March 2021). The Wayback
Machine's capture of the link
(http://web.archive.org/web/20190823161820id_/http://3dgallery.gks.com/2012/blade/blade.php)
is truncated at 1 MiB but keeps the STL header, "STL Output from geomagic
Studio", and its triangle count, 1499981.

The site footer asserts "(c) 2026 CyberOptics Corporation. All Rights
Reserved." and the page states no licence of its own. The "Terms of Use" its
footer links to, at cyberoptics.com, grants permission "to temporarily
download one copy of the materials ... for personal, non-commercial
transitory viewing only", and says that under that licence you may not "use
the materials for any commercial purpose", or "transfer the materials to
another person or 'mirror' the materials on any other server". Whether that
boilerplate is meant to govern the sample downloads is arguable, but no grant
of redistribution rights exists anywhere on the site, so the terms are
recorded as undetermined. Downstream users, especially commercial ones,
should contact Laser Design or substitute another mesh.
"""

