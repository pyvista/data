[[dataset]]
name = "action_figure"
title = "Tiger fighter action figure"
description = "Scan of an action figure captured with an Artec Spider scanner, at full resolution (314218 vertices, 628432 triangles) and decimated to 31421 triangles."
path = ["tigerfighter.obj", "tigerfighter_decimated.obj"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "https://www.laserdesign.com/sample-files/action-figure/"
origin_title = "Laser Design sample files, Action Figure"
collection = "laser-design"
redistributed_from = ["http://3dgallery.gks.com/2013/tigerfighter"]
modified = true
modification = "`tigerfighter.obj` is the file as served. `tigerfighter_decimated.obj` was made in pyvista/data#55 with `examples.download_action_figure().clean().decimate(0.95)` and written by meshio 5.3.5 on 2025-01-29; it has 15713 vertices and 31421 faces."
notes = """
Laser Design Inc. publishes this scan on the "Action Figure" page of its
public sample-file archive, which says it was captured with the Artec Spider
3D scanner. The file's own header agrees: "# File exported by Artec Group 3D
Scanning Solutions", "# 314218 vertices", "# 628432 triangular faces".

The 2019 capture of that page,
http://web.archive.org/web/20191021081456/https://www.laserdesign.com/sample-files/action-figure/,
links its Download button to http://3dgallery.gks.com/2013/tigerfighter, the
URL pyvista's first loader fetched (pyvista commit 24cec36d3, July 2019). GKS
Services Corp. is a subsidiary of Laser Design Inc.
(https://www.laserdesign.com/30-years-of-scanning-excellence-with-gks-services-corp/).
The Wayback Machine's capture of that download,
http://web.archive.org/web/20191121170146id_/http://3dgallery.gks.com/2013/tigerfighter/,
holds the first 1048576 bytes of the file, and they are byte-identical to
`tigerfighter.obj` (`cmp` reports only end of file on the capture).

The page states no licence of its own, and the site footer links
https://cyberoptics.com/website-terms-conditions-of-use/ as "Terms of Use"
(the host refuses scripted requests; the 2024-05-27 capture at
http://web.archive.org/web/20240527060434/http://www.cyberoptics.com/website-terms-conditions-of-use/
is readable). Those terms grant permission "to temporarily download one copy
of the materials ... for personal, non-commercial transitory viewing only",
and say that under that licence you may not "use the materials for any
commercial purpose", or "transfer the materials to another person or 'mirror'
the materials on any other server". Whether that boilerplate is meant to
govern the sample downloads is arguable, but no grant of redistribution
rights exists anywhere on the site, so the terms are recorded as
undetermined. Downstream users, especially commercial ones, should contact
Laser Design or substitute another mesh.
"""

[[dataset]]
name = "aero_bracket"
title = "Aircraft engine bearing bracket"
description = "Static stress analysis of an aircraft engine bearing bracket, carrying displacement, total nonlinear strain and von Mises stress on 187037 points of a quadratic tetrahedral mesh, with a screenshot of the result in the SimScale post-processor."
path = ["fea/aero_bracket/**"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "https://www.simscale.com/projects/simscale/aircraft_engine_bearing_bracket_analysis/"
origin_title = "SimScale public project: Aircraft engine bearing bracket analysis"
collection = "simscale"
modified = true
modification = "One run of the project (`sim_1/sim_1_0_0.vtu`) was read with PyVista, its coordinates and point data cast to float32 and its cell data cleared, to reduce the file size."
notes = """
The project page's description reads: "This project demonstrates the static
stress analysis of three aircraft engine bearing bracket models considering
both linear and nonlinear material definition. The models used in this
analysis are taken from GrabCAD users who were the winners of GrabCAD
'Airplane Bearing Bracket Challenge'. The models are tested with horizontal
and vertical loading conditions as provided on the challenge page of
GrabCAD." pyvista/data#31 quotes that text and says the data "was downloaded
from the public datasets from SimScale"; the reduction script is in the
README that pull request added,
https://github.com/pyvista/data/blob/c1e0fc17d281f4567be43a03ff45cd7947869aac/Data/fea/aero_bracket/README.md.
The mesh is 117292 quadratic tetrahedra (VTK cell type 24) on 187037 points
with an empty CellData block; `simscale-bracket.png` is a 787 by 840
screenshot of SimScale's post-processor showing the von Mises stress.

The project is owned by the `simscale` account (the page's `ownerName`
field). SimScale's Terms and Conditions,
https://www.simscale.com/terms-and-conditions/, clause 5.2, grant SimScale,
its users and visitors of its websites an irrevocable right to reproduce,
distribute and publish "Community Content", defined there as content
uploaded or generated by a Customer under a Free Plan. A project published
by SimScale itself is not customer content, and no other clause grants
visitors rights over it, so the terms are recorded as undetermined; a
downstream user who needs terms should ask SimScale, naming the project. The
bracket geometry originates from the GrabCAD Airplane Bearing Bracket
Challenge, https://grabcad.com/challenges/airplane-bearing-bracket-challenge/entries;
which of the winning models this run used, and under what terms its author
published it, was not recorded.
"""

[[dataset]]
name = "alpha_channel"
