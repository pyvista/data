[[dataset]]
name = "dicom_directory"
title = "DICOM directory sample"
description = "Single sagittal spine MR slice from 1994, used to exercise directory-based DICOM reading. Carries an unredacted patient identity in its header: see the notes before using it."
path = ["DICOMDirectory/**", "mr.001"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "inferred"
origin_url = "https://data.kitware.com/#collection/55f17f758d777f6ddc7895b7"
origin_title = "VTK Data"
collection = "vtk-data"
redistributed_from = ["https://github.com/lorensen/VTKExamples/tree/master/src/Testing/Data/DICOMDirectory"]
notes = """
This file carries an identifiable patient's data and should not be used or
redistributed until that is resolved.

It is a 1994 sagittal spine MR from a Siemens MAGNETOM VISION. It has the
128-byte preamble but no `DICM` magic and no file-meta group, starting
straight into an implicit-VR dataset, which is likely why nobody had parsed
it. Reading the tags directly shows `PatientName` populated with a
caret-separated personal name rather than a study code, `PatientBirthDate`
populated with a full date, `PatientID` embedding that same date,
`PatientSex`, `PatientAge` and `PatientWeight` populated, `AccessionNumber`
populated, `StudyDate` and `StudyTime` giving the acquisition to the
millisecond, `DeviceSerialNumber` populated, and `InstitutionName` and
`StationName` both holding the same string naming a radiology department. A
Siemens private tag `(0051,1010)` repeats the name, the identifier, the date
of birth and the institution as burned-in display text, so removing the
standard tags alone would not de-identify it. The values are internally
consistent, which argues they are real rather than placeholders.

The identifiers are not reproduced here. They can be read from the file with
a short parser; see `Establishing where a dataset came from` in
CONTRIBUTING.md.

The trail ends at VTK Data: `mr.001` entered VTKData on 2004-03-30 (commit
79f41c7, "added sample dicom file") and came here with the March 2019 fork;
`DICOMDirectory/mr.001` is the same bytes, copied in April 2019 from
`src/Testing/Data/DICOMDirectory` in `lorensen/VTKExamples`. Nothing in VTK
names the hospital or a release, and the Girder collection page states no
origin or terms, so the origin is inferred from the redistribution record
only.

No licence is recorded because none can be: Kitware's collection notice
cannot license a hospital's patient study, and no consent or release was
found. The same bytes are distributed by VTK as `Testing/Data/mr.001`
(SHA-512 `c0f3a78e...`), so this is not only this repository's to fix.
"""

