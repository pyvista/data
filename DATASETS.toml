    curl -sL "http://web.archive.org/web/2020id_/http://www-static.cc.gatech.edu/data_files/large_models/horse.ply.gz" | gunzip | shasum -a 256
    # dfadaea01775943a75f9bf0560e6ad55aab39694af3003d9976a46e58226c4d7

The archive page says only "This model appears here courtesy of Cyberware,
Inc." That is permission for Georgia Tech to host it, not a licence granting
anything onward, so no terms could be established for redistribution or for
commercial use. The header's `plyop` and `flipply` comments are the Stanford
range-scan toolchain, consistent with a Cyberware scan.

It reached this repository through the VTK Examples import and was covered by
that entry's blanket Apache-2.0, which is not Lorensen's to grant here.
"""

