[[dataset]]
name = "frog"
title = "Frog anatomy volume"
description = "Segmented volume of a frog from the LBNL Whole Frog Project, as a MetaImage header plus compressed raw data (470 by 500 pixels, 136 slices), with a companion tissue-label volume."
path = ["froggy/**"]
SPDX-License-Identifier = "LicenseRef-LBNL-WholeFrog"
SPDX-FileCopyrightText = ["Lawrence Berkeley Laboratory"]
provenance = "verified"
origin_url = "https://froggy.lbl.gov/images/whole.frog/data/"
origin_title = "LBNL Whole Frog Project, slice image data"
collection = "vtk-examples"
authors = ["Bill Johnston", "Wing Nip"]
attribution = "Whole Frog Project, Lawrence Berkeley National Laboratory (https://froggy.lbl.gov/), images and data by Bill Johnston and Wing Nip; provided for scientific research, commercial use requires prior agreement with the laboratory."
redistributed_from = ["https://github.com/lorensen/VTKExamples/tree/master/src/Testing/Data/Frog"]
modified = true
modification = "frog.zraw holds the voxels of LBNL's frog.data.Z re-compressed with zlib inside a MetaImage wrapper; frogtissue combines the per-tissue mask files into one labelled volume, as the VTK textbook describes."
notes = """
`frog.zraw`, decompressed, is byte-identical to LBNL's `frog.data.Z`
uncompressed (31960000 bytes, sha256 1ba5e6dc1622462b...); `frog.hd` there
reads "470(r)x500(c)x136 unsigned byte" and `frog.mhd` here reads
`DimSize = 500 470 136`. The directory's `Copyright.Notice` states the
terms: "These images and data were produced at Lawrence Berkeley Laboratory
by Bill Johnston and Wing Nip of the Information and Computing Sciences
Division ... This data is provided for the purpose of scientific research
and collaboration with Lawrence Berkeley Laboratory. Any commercial use of
these images and data require prior agreement with Lawrence Berkeley
Laboratory. The images and data are Copyright Lawrence Berkeley
Laboratory." The project page's credits date the work to 1993-1995 under
DOE contract DE-AC03-76SF00098.

The VTK textbook (`src/VTKBook/12Chapter12.md` in vtk/vtk-examples) says
the data "was prepared at Lawrence Berkeley National Laboratories and is
included with their permission on the CD-ROM accompanying this book", that
the segmentation is 15 tissue masks over 136 slices of 470 by 500 pixels,
and that the masks were combined into one file per slice with integers 1 to
15 for the tissues; `frogtissue` is that combined volume and was not
compared with LBNL's mask files. The four files reached this repository
through the April 2019 import of `src/Testing/Data/Frog` from
lorensen/VTKExamples, where they are git-LFS objects whose `oid sha256` and
size equal the files here; `Data/Frog` was renamed to `Data/froggy` a month
later. They are not in the VTK Data collection or VTK's content links. The
permission the book records covers its CD-ROM, and the examples repository's
Apache-2.0 does not cover LBNL's data; the terms that bind are LBNL's
notice.
"""

