notes = """
Both files are VTK test data. `can.vtu` matches VTK's content link
`Testing/Data/can.vtu.sha512` (SHA-512 86ce9b2d...) and was added from
VTKDataFiles-9.3.0.tar.gz in pyvista/data#36. `hdf/can-vtu.hdf` matches the
