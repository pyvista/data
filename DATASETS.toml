# Dataset metadata for the PyVista example data repository.
#
# This file is the single source of truth for the provenance and licensing of
# every file under `Data/`. PyVista will read it through `examples.get_example(...)`,
# which returns an `Example` whose `.metadata` is the dataset's record, and publish
# it in the Dataset Gallery once pyvista/pyvista#9118 merges; this repository
# checks it on every pull request with `tools/validate_datasets.py`.
#
# Read `CONTRIBUTING.md` before editing. It documents how the provenance here
# was established and how to check it. In short:
#
#   * every file under `Data/` must be covered by exactly one `[[dataset]]`;
#   * `[[dataset]]` blocks are sorted by `name`;
#   * `SPDX-License-Identifier` must resolve to a `[license.*]` table below;
#   * `LICENSE`, `COPYING`, `COPYRIGHT`, `NOTICE`, `README` and `CITATION` files
#     (any letter case, singular or plural, bare or with any extension) and
#     `.license` sidecars are not tracked under `Data/`.
#
# The licensing keys borrow their names and meaning from the REUSE
# specification (https://reuse.software): `SPDX-License-Identifier` and
# `SPDX-FileCopyrightText` carry exactly the meaning they carry there, and
# LICENSES/ is named the way REUSE names it. No REUSE tool reads this file.
#
# The root `LICENSE` does not cover the data. See README.md.

