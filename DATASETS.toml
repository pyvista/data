    python3 -c "import numpy as np, pyvista as pv; a=pv.read('head.vti').active_scalars.reshape(94,256,256); b=pv.read('FullHead.mhd').active_scalars.reshape(94,256,256); print(np.array_equal(a, b[:, ::-1, :]))"

