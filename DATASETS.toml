sample-files page no longer lists the drill, and the gallery has no Wayback
capture, so the bytes could not be compared with the source.

The sample-file pages state no licence of their own, and the site footer
asserts "(c) 2026 CyberOptics Corporation. All Rights Reserved." The "Terms
of Use" the footer links to, at cyberoptics.com, grants permission "to
temporarily download one copy of the materials ... for personal,
non-commercial transitory viewing only", and says that under that licence
you may not "use the materials for any commercial purpose", or "transfer the
materials to another person or 'mirror' the materials on any other server".
Whether that boilerplate is meant to govern the sample downloads is arguable,
but no grant of redistribution rights exists anywhere on the site, so the
terms are recorded as undetermined. Downstream users, especially commercial
ones, should contact Laser Design or substitute another mesh.
"""

[[dataset]]
name = "earth_models"
title = "Global topography and coastlines"
description = "ETOPO1 global relief downsampled to ten arc-minutes, a land-only variant, and world coastlines, projected to a sphere."
path = ["EarthModels/**"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "http://web.archive.org/web/20191018222040/http://www.earthmodels.org/data-and-tools/topography/etopo"
origin_title = "earthmodels.org, ETOPO example files for ParaView (Wayback Machine)"
references = [
    { citation = "Amante, C. and B. W. Eakins, ETOPO1 1 Arc-Minute Global Relief Model: Procedures, Data Sources and Analysis. NOAA Technical Memorandum NESDIS NGDC-24, 19 pp, March 2009." },
]
notes = """
The three files were published by earthmodels.org, the LMU Munich geophysics
site (its imprint names the Department of Earth and Environmental Sciences,
Geophysics, Ludwig-Maximilians-University Munich), which the Wayback Machine
archived. Its ETOPO page lists `ETOPO_10min_Ice.vtp` ("Global topography in
a resolution of 10 arc minutes") and `ETOPO_10min_Ice_only-land.vtp` ("Same,
but only land; created using the threshold filter (exclude everything below
zero) and then the 'extract surface' filter") under "Example Files for
Paraview", and states "License: public domain?" with Amante and Eakins 2009
as the author. Its Los Alamos coastlines page
(http://web.archive.org/web/20191218195505/http://www.earthmodels.org/data-and-tools/coastlines/los-alamos)
lists `Coastlines_Los_Alamos.vtp`, states "License: probably public domain"
and says the data "has its origins at the Los Alamos National Laboratory. It
has been handed on to other people several times, so the creator remains
unknown." The archived coastlines file is byte-identical to the copy here:

    curl -sSL -o c.vtp 'http://web.archive.org/web/20180401164951id_/http://www.earthmodels.org/data-and-tools/coastlines/Coastlines_Los_Alamos.vtp'
    shasum -a 256 c.vtp Data/EarthModels/Coastlines_Los_Alamos.vtp   # both 5bd3bbff...

The two ETOPO files were not archived, but the page names them exactly and
`ETOPO_10min_Ice.vtp` has 2336041 points, a 2161 by 1081 ten arc-minute
global grid. Added here in March 2019 for PVGeo ("add global topo", "add
coastlines"). Neither page states terms for the derived files, so the
licence is left undetermined; downstream users needing certainty should
rebuild from NOAA ETOPO1, a US federal work, or ask LMU Munich geophysics.
"""

