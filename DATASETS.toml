notes = """
Not company logos, which is what the filenames suggest. Each file is headed
`Data values for stock` and holds 345 to 348 daily closes with a `volume`
scalar, priced in eighths, which is how United States equities were quoted
before decimalisation in 2001.

The VTK textbook says where they came from, in `src/VTKBook/12Chapter12.md`
inside `vtk/vtk-examples`:

    We obtained our data from a public site on the World Wide Web (WWW) that
    archives stock prices and volumes for many publicly traded stocks.

So this is third-party market data of unrecorded origin, converted by the
book's authors. A site that archives prices does not thereby license them,
and the VTK Examples Apache-2.0 the files were recorded under is not the
archive's to give. All four files arrived with the April 2019
lorensen/VTKExamples import (commit 74bf994) as the same git blobs that Bill
Lorensen added to that repository on 2017-12-17 with the Stocks.cxx example
(commit a152d24d); vtk/vtk-examples now holds the same bytes in LFS (its
pointers' sha256 match the four files).
"""

