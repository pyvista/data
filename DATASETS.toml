which is where the copyright line and the BSD notice recorded here come
from. That loose copy went away when the directory was replaced by the
archive a month later, but the archive still carries it as
`OpenFOAM/Copyright.txt`. Every one of the 40 files that Girder records
under the VTK Data `OpenFOAM` folder, which holds both the `cavity` and the
`64BitFloats` case, matches the sha512 of the archive member of the same
path; the archive's four other members are two empty `case.foam` sentinels,
a `.directory` file and `Copyright.txt`.

The cavity case is the icoFoam lid-driven cavity tutorial: its
`constant/polyMesh/blockMeshDict` carries the OpenFOAM 1.7.1 banner and has
the same vertices, single 20 by 20 by 1 block and `movingWall`, `fixedWalls`
and `frontAndBack` patches as the tutorial file in
https://github.com/OpenFOAM/OpenFOAM-2.0.x/blob/master/tutorials/incompressible/icoFoam/cavity/constant/polyMesh/blockMeshDict,
differing only in the banner and the 2.0 boundary syntax (release 1.7.1 is
not on GitHub). OpenFOAM distributes its tutorials under the GNU General
Public License, version 3 or any later version
(https://github.com/OpenFOAM/OpenFOAM-2.0.x/blob/master/COPYING), which
Kitware's notice cannot replace, so that licence is recorded alongside
Kitware's for the tutorial dictionaries; the solved fields are the output of
running the solver. The `64BitFloats` case carries an OpenFOAM 1.3 banner
and was not matched to any tutorial.
"""

