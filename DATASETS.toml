references = [
    { citation = "B. Yamrom and K. M. Martin. Vector Field Animation with Texture Maps. IEEE Computer Graphics and Applications 15(2):22-24, 1995.", doi = "10.1109/38.365001" },
]
notes = """
Nine 16 by 1 by 1 structured-points texture maps whose headers read `vtk
DataFile Version 1.0` and `Texture map for animating vectors (map 1/16)`.
VTK's own `animVectors` example has read them as
`$VTK_DATA/vecTex/vecAnimN.vtk` since the examples entered CVS in March 1996
(VTK commit 1994513af7; the 1998 Python port reads
`../../../vtkdata/vecTex/vecAnim1.vtk`), and Bill Lorensen's AnimateVectors
example, which recreates VTK textbook Figure 7-3, cites Yamrom and Martin
(1995) for the technique, so the data are the VTK project's. They are absent
from the December 1999 and July 2013 VTKData trees in this repository's
history and from VTK's `Testing/Data` content links, so no byte match with
the original `vtkdata` distribution was possible and its terms for these
bytes could not be checked.

The copies here were imported in April 2019 from
`src/Testing/Data/VectorAnimation` in `lorensen/VTKExamples` (all nine blobs
match), which Lorensen, one of VTK's authors, published under the Apache
License 2.0 and which Kitware now maintains as `vtk/vtk-examples`; that
repository licence is what is recorded.
"""

