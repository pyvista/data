[[dataset]]
name = "emg3d_dipole"
title = "Electromagnetic dipole fields"
description = "Absolute values of the x, y and z components of the electric and magnetic fields of an electric dipole source in a whole-space with anisotropic resistivity, computed with emg3d."
path = ["emg3d/**"]
SPDX-License-Identifier = "Apache-2.0"
provenance = "verified"
origin_url = "https://github.com/pyvista/data/blob/5b579398bb3eee0faf36abf01b33b9e3552de01d/Data/emg3d/dipole/README.md"
origin_title = "pyvista/data, emg3d dipole README with the generating script"
authors = ["Alex Kaszynski"]
attribution = "Generated by Alex Kaszynski for PyVista with emg3d (https://github.com/emsig/emg3d) and contributed to pyvista/data under its Apache-2.0 licence."
modified = true
modification = "The absolute value of each field component was cast to float32 and written as point scalars (`efield_fx`, `efield_fy`, `efield_fz`; `hfield_fx`, `hfield_fy`, `hfield_fz`) on a unit-spacing uniform grid with the shape of the x component, so the stretched emg3d mesh coordinates are not preserved."
notes = """
The generating script is in the README that came with the files (commit
5b57939, Alex Kaszynski, 2022-07-23, removed in b91ceb8 when the per-dataset
READMEs were migrated into this table). It adapts the emg3d gallery minimum
example, https://emsig.xyz/emg3d-gallery/gallery/tutorials/minimum_example.html,
with a mesh built for 160 Hz, a solve at 20 Hz and resistivities of 1.5, 1.8
and 3.3 in x, y and z, so the values here are not those shown on the gallery
page. Both files are legacy `DATASET STRUCTURED_POINTS` with `SPACING 1 1 1`
and `ORIGIN 0 0 0`, 96 by 97 by 97 points for `efield.vtk` and 97 by 96 by 96
for `hfield.vtk`.

emg3d itself is Apache-2.0, but simulation output is not a derivative of the
solver source. The files were made for this repository by its maintainer and
committed directly with no other terms, so the repository's Apache-2.0
licence is the basis recorded here.
"""

