[[dataset]]
name = "ruapehu_topo50"
title = "Ruapehu Topo50 map clip"
description = "Clip of the LINZ Topo50 map sheet covering the Mount Ruapehu crater, 1535 by 1772 pixels at 4.2333 metres."
path = ["BJ34_GeoTifv1-04_crater_clip.tif"]
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileCopyrightText = ["Land Information New Zealand"]
provenance = "inferred"
origin_url = "https://data.linz.govt.nz/layer/50767-nz-topo50-maps/"
origin_title = "LINZ, NZ Topo50 Maps"
authors = ["Land Information New Zealand"]
attribution = "Sourced from the LINZ Data Service and licensed for reuse under CC BY 4.0."
modified = true
modification = "Clipped from the full map sheet to the crater."
notes = """
The GeoTIFF names its projection as "New Zealand Transverse Mercator 2000;
NZGD 2000", ties to easting 1817997.5 and northing 5652503.0 — beside
Ruapehu's crater — and has a pixel scale of 4.2333 metres, which is exactly
1:50,000 at 300 dpi, the resolution LINZ publishes Topo50 rasters at. The
filename follows LINZ's `<sheet>_GeoTifv<version>` convention, and BJ34 is
the Topo50 sheet covering Ruapehu.

The LINZ Data Service reports the layer's licence through its API:

    curl -s "https://data.linz.govt.nz/services/api/v1/layers/50767/"
    # "license": {"title": "Creative Commons Attribution 4.0 International", ...}

Inferred rather than verified: the identification rests on the projection,
the tiepoint, the pixel scale and the filename together, not on a statement
by whoever clipped it.
"""

