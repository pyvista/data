description = "Montage of icons from the Tango Icon Library, used to exercise the icon glyph filter."
path = ["Tango/**"]
SPDX-License-Identifier = "CC-BY-SA-2.5"
provenance = "verified"
origin_url = "https://web.archive.org/web/20080301221554/http://tango.freedesktop.org/Tango_Desktop_Project"
origin_title = "Tango Desktop Project, Tango Icon Library 0.8.1"
collection = "vtk-data"
authors = ["Ulisse Perusin", "Steven Garrity", "Lapo Calamandrei", "Ryan Collier", "Rodney Dawes", "Andreas Nilsson", "Tuomas Kuosmanen", "Garrett LeSage", "Jakub Steiner"]
attribution = "Icons from the Tango Icon Library 0.8.1, Tango Desktop Project (http://tango.freedesktop.org/), licensed under Creative Commons Attribution-ShareAlike 2.5; montaged by VTK."
redistributed_from = ["https://data.kitware.com/#collection/55f17f758d777f6ddc7895b7"]
modified = true
modification = "A subset of the icons was montaged into a single image."
notes = """
VTK montaged the icons in March 2008 and its
`Testing/Data/Tango/README.VTK.txt` names Tango Icon Library 0.8.1 and
creativecommons.org/licenses/by-sa/2.5/. The 0.8.1 tarball (Wayback:
https://web.archive.org/web/2007id_/http://tango.freedesktop.org/releases/tango-icon-theme-0.8.1.tar.gz)
ships the CC BY-SA 2.5 text as `COPYING`, with no copyright line, and lists
the nine artists recorded in `authors` in `AUTHORS`. The project page
captured on 2008-03-01, nine days before the montage entered VTK Data,
states the same licence and that "Use of icons from the tango-icon-theme
module must be attributed to the Tango Desktop Project". No copyright holder
or year is stated for 0.8.1, so none is recorded. `TangoIcons.png` is in the
VTK Data tree this repository was forked from, and VTK ships
`Tango/TangoIcons.png.sha512`.

The project later released the base icon theme to the public domain: the
page captured in 2010
(https://web.archive.org/web/2010/http://tango.freedesktop.org/Tango_Desktop_Project)
reads "The Tango base icon theme is released to the Public Domain ... we ask
that you still please attribute the Tango Desktop Project", and Debian
records the 0.8.90 series as public-domain. A downstream user who needs the
same icons unencumbered should take them from a release after 0.8.1 rather
than from here.

ShareAlike propagates from the 2.5 terms recorded here.
"""

