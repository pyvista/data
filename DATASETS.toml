SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileCopyrightText = ["1993-2008 Ken Martin, Will Schroeder, Bill Lorensen"]
provenance = "inferred"
origin_url = "https://data.kitware.com/#collection/55f17f758d777f6ddc7895b7"
origin_title = "VTK Data"
collection = "vtk-data"
attribution = "VTK Data. Copyright (c) 1993-2008 Ken Martin, Will Schroeder, Bill Lorensen. BSD 3-Clause."
notes = """
Inherited from the VTK Data collection when this repository was forked from
it in March 2019. Kitware's blanket `Copyright.txt` notice covers the
collection as a whole, and is recorded here as the licence for this entry.

The file was added to VTKData on 2006-12-11 by Utkarsh Ayachit, committing
from a kitware.com address ("ENH: Added data for opacity test which tests
opacity", commit b85a99f in this repository's history), and its PNG text
chunk reads "Created with The GIMP", so it is a synthetic image made
in-house for VTK's opacity tests (`Rendering/Core/Testing/Python/TestOpacity2.py`
and two C++ tests under `Rendering`). VTK still distributes the same bytes
(`Testing/Data/alphachannel.png.sha512`). Provenance stays inferred because
no source states who drew it; the commit and the text chunk are the basis.
"""

[[dataset]]
name = "amr"
title = "Adaptive mesh refinement samples"
description = "Two hierarchical box datasets (VTK XML `.vthb` files, versions 1.0 and 1.1 of the format, each with 81 image-data blocks over four refinement levels) carrying `Fractal Volume Fraction`, `BlockId`, `Depth`, `TestX` and `VectorXYZ` arrays, used to exercise the AMR readers and filters."
path = [
    "AMR/HierarchicalBoxDataset.v1.0.vthb",
    "AMR/HierarchicalBoxDataset.v1.0/**",
    "AMR/HierarchicalBoxDataset.v1.1.vthb",
    "AMR/HierarchicalBoxDataset.v1.1/**",
]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileCopyrightText = ["1993-2008 Ken Martin, Will Schroeder, Bill Lorensen"]
provenance = "inferred"
origin_url = "https://data.kitware.com/#collection/55f17f758d777f6ddc7895b7"
origin_title = "VTK Data"
collection = "vtk-data"
attribution = "VTK Data. Copyright (c) 1993-2008 Ken Martin, Will Schroeder, Bill Lorensen. BSD 3-Clause."
notes = """
Inherited from the VTK Data collection: both datasets are in the 2013
VTKData tree this repository was created from in March 2019. The
`Data/AMR/Enzo` files that used to share this entry are now `amr_enzo`.

Both datasets were added to VTKData by Utkarsh Ayachit of Kitware on
2012-10-08 ("Adding datasets for XML AMR IO testing", commit fc83fc6 in this
repository's history). Their arrays (`Fractal Volume Fraction`, `BlockId`,
`Depth`, `TestX`, `VectorXYZ`) are the outputs of ParaView's synthetic
`vtkHierarchicalFractal` AMR source
(https://github.com/Kitware/ParaView/blob/master/VTKExtensions/FiltersGeneral/vtkHierarchicalFractal.cxx),
so the data is generated by Kitware, not measured, and Kitware's blanket
`Copyright.txt` notice for the collection is recorded as its licence.
Inferred because no upstream page states the generator; the array names and
the Kitware author are the evidence. VTK still distributes the same bytes
(https://gitlab.kitware.com/vtk/vtk/-/blob/master/Testing/Data/AMR/HierarchicalBoxDataset.v1.0.vthb.sha512
and siblings).
"""

[[dataset]]
name = "amr_enzo"
title = "Enzo AMR sample (moving7)"
description = "Output DD0010 of the Enzo adaptive-mesh test run `moving7` (Enzo problem type 27 in comoving coordinates): the parameter, hierarchy, boundary and processor-map files and the packed-HDF5 grid data for a 16 by 16 by 16 top grid with five baryon fields."
path = ["AMR/Enzo/**"]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileCopyrightText = ["2006-2013 Matthew Turk", "2013- yt Development Team"]
provenance = "verified"
origin_url = "https://github.com/yt-project/yt/tree/main/tests/DD0010"
origin_title = "yt test data, tests/DD0010"
collection = "vtk-data"
authors = ["Matthew Turk"]
attribution = "moving7_0010 Enzo test data from the yt project (https://github.com/yt-project/yt), copyright (c) 2006-2013 Matthew Turk and 2013- yt Development Team, BSD 3-Clause."
redistributed_from = [
    "https://gitlab.kitware.com/vtk/vtk/-/blob/master/Testing/Data/AMR/Enzo/DD0010/moving7_0010.sha512",
    "https://data.kitware.com/#collection/55f17f758d777f6ddc7895b7",
]
notes = """
These are the `DD0010/moving7_0010` files that the yt project ships in its
repository and uses in its documentation ("the DD0010/moving7_0010 dataset
distributed in the yt git repository",
https://github.com/yt-project/yt/blob/main/doc/source/reference/command-line.rst).
The bytes prove it: `moving7_0010.cpu0000`, `moving7_0010.boundary.hdf` and
`moving7_0010.procmap` have the same git blob ids as yt's current copies
(416b69d2fe6e, f090446924d7, ea09cc5c9522; compare
`gh api repos/yt-project/yt/contents/tests/DD0010` with
`git ls-tree -r HEAD Data/AMR/Enzo/DD0010`), and `moving7_0010`,
`moving7_0010.hierarchy` and `moving7_0010.boundary` are identical to yt's
files at yt commit 5c5eef8 (Matthew Turk, 2008-05-03, "Supplemented the test
data with Packed-HDF5 data"); yt's later copies differ only by a
`CurrentTimeIdentifier` line added in 2011 and whitespace clean-ups in 2020.
The `.boundary` and `.procmap` files name their original location as
`/rmount/users08/stanford/mturk/data/DD0010/`. `moving7_0010.harrays` has no
counterpart in yt.

George Zagaris of Kitware added the files to VTKData on 2012-03-12 ("ENH:
Adding Enzo AMR test cases", commit 4280128 in this repository's history)
for VTK's Enzo reader tests; they reached this repository in the 2013
VTKData tree it was created from, and VTK still distributes the same bytes
through the content links in `Testing/Data/AMR/Enzo/DD0010/`.

yt's `COPYING` file (https://github.com/yt-project/yt/blob/main/COPYING)
licenses the repository under the Modified BSD licence, "Copyright (c)
2013-, yt Development Team" and "Copyright (c) 2006-2013, Matthew Turk",
