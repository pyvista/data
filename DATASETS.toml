    git -C VTK show e5dab6a08b:Testing/Data/can-vtu.hdf.sha512

Kitware publishes no per-file provenance for VTK Data, but the Exodus QA
records carried in the field data of both files name the toolchain FASTQ,
Gen3D 1.7, GJoin 1.12 and PRONTO3D 7.0.1, a run date of 16 May 1994, the
