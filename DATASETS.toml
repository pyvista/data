The six faces are byte-identical to VTK's
`Testing/Data/skybox-{nx,ny,nz,px,py,pz}.jpg` content links:

    for f in nx ny nz px py pz; do
      shasum -a 512 Data/skybox-$f.jpg | cut -d' ' -f1 | diff - <(cut -d' ' -f1 VTK/Testing/Data/skybox-$f.jpg.sha512)
    done

VTK added them on 2016-07-06 (commit 64017f58d9, Joachim Pouderoux,
"Introduce cube map creation from raw images", for `TestCubeMap.cxx`), which
names no source. Bill Lorensen added the same files to `lorensen/VTKExamples`
on 2018-03-12 (commit cace6412d1, "ENH: Add CubeMap and SphereMap shader
examples.") and they were moved into `skyboxes/skybox1` on 2019-10-19; the
loose faces here came with the April 2019 import of that repository, and the
`skybox/` copies and `skybox-lorensen.zip` (six faces renamed negx/posx and
so on, same blobs) with the October 2022 "add skybox" commit, whose source
is not recorded. VTK Data is therefore the furthest point established and
its BSD-3-Clause collection licence is recorded. Neither VTK nor the VTK
Examples says who made the images, so the origin is inferred. The unrelated
`skybox2` set turned out to be Emil Persson's under CC BY 3.0.
