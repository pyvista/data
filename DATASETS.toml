[[dataset]]
name = "great_white_shark"
title = "Great white shark"
description = "Triangulated surface mesh of a great white shark, in STL format."
path = ["great_white_shark/**"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "inferred"
origin_url = "https://www.cgtrader.com/free-3d-models/animals/fish-aquatic/great-white-shark--3"
origin_title = "CGTrader, Great white shark by Cartoomotion"
collection = "vtk-examples"
authors = ["Cartoomotion"]
redistributed_from = [
    "https://www.thingiverse.com/thing:425437",
    "https://github.com/lorensen/VTKExamples/blob/master/src/Testing/Data/greatWhite.stl",
]
notes = """
Imported from the VTK Examples test data: the blob is identical to
`src/Testing/Data/greatWhite.stl` in lorensen/VTKExamples, added there on
2019-06-07 ("ENH: New inout datasets"), and pyvista/data pull request 46
took it from VTK Examples. The STL header records only that the mesh was
reprocessed through netfabb and embeds no origin or licence, and the
upstream commits reference neither.

The chain runs back through Thingiverse thing:425437, "Great White Shark" by
shraska1, published 12 August 2014. Its `rel="license"` link named
creativecommons.org/licenses/by-sa/3.0/ in the capture of 4 March 2015 at
web.archive.org/web/20150304082408/http://www.thingiverse.com/thing:425437;
the live page has since been relabelled CC BY-SA 4.0. That uploader
disclaims authorship and names a CGTrader page as the origin, and that page
is readable in the Wayback Machine:

    curl -sL "https://web.archive.org/web/20150130013539id_/http://www.cgtrader.com:80/free-3d-models/animals/fish-aquatic/great-white-shark--3"

It credits Cartoomotion, and it states terms under "License: General
License": "Content published with the General label may not be sold, given,
or assigned to another person or entity in the form it is downloaded from
the site."

So the head of the chain does state terms, and they are a redistribution
restriction rather than a grant. Whether shraska1 could apply CC BY-SA to a
model published under that label is exactly the question, and it is not one
this repository can answer. The licence stays undetermined, and the
restriction is the reason: redistributing the mesh in the form it was
downloaded is what the General License names. Downstream users, especially
commercial ones, should substitute a shark model with documented licensing,
and this repository should consider dropping the file.

The geometry is consistent with that page, which reports 3,672 polygons and
3,770 vertices: 2,592 quads and 1,080 triangles would triangulate to exactly
the 6,264 triangles here, over 3,155 unique vertex positions after netfabb's
reprocessing. The split is arithmetic, not something the page states.
"""

