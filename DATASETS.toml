grids here are 80 by 80 with a single `z` point array ranging over -1 to 1,
which is what that script produces. The pull request states no licence of
its own, so the contribution is recorded under the repository's Apache-2.0
(its `LICENSE`), the basis being that it was made for this repository and
submitted with no other terms.

