[[dataset]]
name = "action_figure"
title = "Tiger fighter action figure"
description = "Scan of an action figure, at full resolution and decimated to about 31 thousand cells."
path = ["tigerfighter.obj", "tigerfighter_decimated.obj"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "https://www.laserdesign.com/sample-files/"
origin_title = "Laser Design sample files"
collection = "laser-design"
notes = """
Laser Design Inc. publishes these scans in its public sample-file archive to
demonstrate its scanning services. The archive page states no licence of its
own, and the site footer asserts "(c) 2026 CyberOptics Corporation. All Rights
Reserved."

The "Terms of Use" its footer links to, at cyberoptics.com, grants permission
"to temporarily download one copy of the materials ... for personal,
non-commercial transitory viewing only", and says that under that licence you
may not "use the materials for any commercial purpose", or "transfer the
materials to another person or 'mirror' the materials on any other server".
Whether that boilerplate is meant to govern the sample downloads is arguable,
but no grant of redistribution rights exists anywhere on the site, so the
terms are recorded as undetermined. Downstream users, especially commercial
ones, should contact Laser Design or substitute another mesh.
"""

[[dataset]]
