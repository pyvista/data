SPDX-License-Identifier = "LicenseRef-SimScale-PublicProject"
provenance = "verified"
origin_url = "https://www.simscale.com/projects/"
origin_title = "SimScale public project library"
collection = "simscale"
modified = true
modification = "Coordinates and point data cast to float32 and cell data dropped to reduce the file size."
notes = "The bracket geometry originates from the GrabCAD Airplane Bearing Bracket Challenge, https://grabcad.com/challenges/airplane-bearing-bracket-challenge/entries. The simulation result redistributed here is the SimScale project output. The upstream project analyses three bracket models under horizontal and vertical loading with linear and nonlinear material definitions; the single result redistributed here is one of those runs."

