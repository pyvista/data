with no other terms, so the repository's own `LICENSE`, the Apache License
2.0, is the basis for the licence recorded. Neither is ParaView's, though
both sit in the `paraview` directory and point at ParaView's sphere
animation frames. `dualSphereNoTime.pvd` says so on its own second line:
