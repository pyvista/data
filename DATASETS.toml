[[dataset]]
name = "nasa_plot3d_cfd"
title = "NASA PLOT3D CFD cases"
description = "Two NASA Ames computational fluid dynamics cases in PLOT3D format, a blunt fin on a plate and a combustor, as grid and solution pairs, with the combustor also split into three structured blocks."
path = [
    "bluntfinq.bin",
    "bluntfinxyz.bin",
    "combq.bin",
    "combxyz.bin",
    "StructuredGrid.vts",
    "multicomb_0.vts",
    "multicomb_1.vts",
    "multicomb_2.vts",
    "postq.bin",
    "postxyz.bin",
]
SPDX-License-Identifier = "LicenseRef-PublicDomain"
provenance = "verified"
origin_url = "https://ntrs.nasa.gov/citations/19900013774"
origin_title = "NASA Ames Research Center, PLOT3D User's Manual"
authors = ["NASA Ames Research Center"]
redistributed_from = [
    "https://data.kitware.com/#collection/55f17f758d777f6ddc7895b7",
    "https://github.com/lorensen/VTKExamples/blob/master/src/Testing/Data/postxyz.bin",
]
references = [
    { citation = "C. M. Hung and P. G. Buning, Simulation of blunt-fin-induced shock wave and turbulent boundary-layer interaction, AIAA 22nd Aerospace Sciences Meeting, Reno, 1984, AIAA Paper 84-0457", doi = "10.2514/6.1984-457" },
    { citation = "S. E. Rogers, D. Kwak and U. K. Kaul, A Numerical Study of Three-Dimensional Incompressible Flow Around Multiple Posts, AIAA Aerospace Sciences Conference, Reno, 1986, AIAA Paper 86-0353", url = "https://gitlab.kitware.com/vtk/vtk-examples/-/blob/master/src/VTKBook/12Chapter12.md" },
]
notes = """
The grid headers decode to the published dimensions and the file sizes follow
exactly from them, which is what identifies each case:

    python3 -c "import struct; print(struct.unpack('>3i', open('Data/combxyz.bin','rb').read(12)))"
    # (57, 33, 25), and 12 + 57*33*25*3*4 = 564312 = the file size

`bluntfinxyz.bin` is 40 by 32 by 32, the NASA Ames blunt-fin case of Hung and
Buning (the first reference, DOI resolvable through Crossref); `combxyz.bin`
is 57 by 33 by 25, the Ames combustor, and both pairs are named together in
`Data/test.p3d`. `StructuredGrid.vts` is byte-identical to `multicomb_0.vts`
and had its own entry describing it as a "small structured grid".
`postxyz.bin` is 38 by 76 by 38 with an IBLANK array, the LOx post that
chapter 12 of the VTK textbook introduces as "a dataset from NASA" citing
[Rogers86], whose bibliography entry is the second reference. The three
`multicomb_*.vts` blocks read back through the PLOT3D reader with bounds and
a density range identical to `combxyz.bin` and `combq.bin`, so they are that
case re-blocked.

Route: the blunt fin, combustor and `multicomb_*` files are in the 2013
VTK Data fork tree and VTK still ships content links for them; `postq.bin`,
`postxyz.bin` and `StructuredGrid.vts` are byte-identical to
`lorensen/VTKExamples` and arrived in the April 2019 import of that
repository.

Work produced by NASA employees carries no copyright under 17 U.S.C. Sec. 105.
These files were recorded under the VTK collection notices, Kitware's for
most of them and Lorensen's Apache-2.0 for the LOx post, neither of which
could attach a copyright to federal work.

`bluntfinq.bin` is 484 bytes longer than a single-grid solution file of these
dimensions, so it carries something more than the plain record structure; the
grid it pairs with is unambiguous.
"""

