repository it was imported from; the scan's acquiring institution is not
recorded there either. Averaged 4 by 4 in the slice plane, its first 93
slices correlate 0.9995 with `headsq/quarter.*` (the `headsq` entry), the
quarter-resolution CT head that chapter 12 of the VTK textbook says was
reduced from the original 256 by 256 slices by averaging neighbouring pixels
twice, so this is the full-resolution volume of that CT study. This is human
medical imaging whose subject and consent status were never recorded
upstream.
