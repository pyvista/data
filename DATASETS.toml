path = ["PineRoot/**"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "https://civm.duhs.duke.edu/"
origin_title = "Center for In Vivo Microscopy, Duke University"
collection = "vtk-examples"
authors = ["Janet MacFall"]
redistributed_from = [
    "https://examples.vtk.org/site/VTKBook/09Chapter9/",
    "https://github.com/lorensen/VTKExamples/tree/master/src/Testing/Data/PineRoot",
]
references = [
    { citation = "Schroeder, W., Martin, K. and Lorensen, B. The Visualization Toolkit, chapter 9, Connectivity.", url = "https://examples.vtk.org/site/VTKBook/09Chapter9/" },
]
notes = """
The source is recorded in the VTK textbook that ships inside
`vtk/vtk-examples` at `src/VTKBook/09Chapter9.md` (line 1061) and is
published at https://examples.vtk.org/site/VTKBook/09Chapter9/:

    To illustrate the application of connectivity analysis, we will use an
    MRI dataset generated by Janet MacFall at the Center for In Vivo
    Microscopy at Duke University. The dataset is a volume of dimensions
    2563 and is included on the CD-ROM.

("2563" is 256 cubed, garbled in the Markdown conversion.) `pine_root.mhd`
reads `DimSize = 256 256 256`, `ElementType = MET_USHORT`, so it is that
data. Retrieve the chapter with:

    curl -sS "https://gitlab.kitware.com/api/v4/projects/vtk%2Fvtk-examples/repository/files/src%2FVTKBook%2F09Chapter9%2Emd/raw?ref=master"

Bill Lorensen added the two files to `src/Testing/Data/PineRoot` in
`lorensen/VTKExamples` on 2017-12-01 (commit cce8ea2ea9, "ENH: Added
original pine root data", no terms in the body), and this repository copied
them in April 2019 (commit 74bf994). `pine_root.mhd` matches the upstream
Git LFS pointer by SHA-256 (1fb12258...) and size (935058 bytes) and
`pine_root.mha` by size (23200609 bytes). They are absent from the 2013 VTK
Data tree and from VTK's content links.

That settles the owner and the scope of what was granted: inclusion on the
book's CD-ROM. It is not a licence to redistribute, and Lorensen's Apache-2.0
repository licence cannot reach Duke's data. No terms from Duke or MacFall
were found, so the terms are recorded as undetermined; downstream users
should contact the Duke Center for In Vivo Microscopy before redistributing.

`pine_root.mhd` is a seven-line header whose `ElementDataFile = pine_root.%d
1 256 1` names slice files that are not shipped, padded to 935058 bytes with
newlines; read `pine_root.mha`, which is self-contained.
"""

