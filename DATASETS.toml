[[dataset]]
name = "prostate"
title = "Prostate image"
description = "Single axial CT slice through a human pelvis, 512 by 512, in DICOM despite the `.img` extension."
path = ["prostate.img"]
SPDX-License-Identifier = "LicenseRef-Unknown"
provenance = "verified"
origin_url = "https://github.com/lorensen/VTKWikiExamples"
origin_title = "lorensen/VTKWikiExamples"
collection = "vtk-examples"
authors = ["Memorial Sloan Kettering Cancer Center"]
redistributed_from = ["https://github.com/lorensen/VTKExamples/blob/master/src/Testing/Data/prostate.img"]
modified = true
modification = "A 128-byte zero preamble and the `DICM` prefix were prepended in January 2022 (https://github.com/pyvista/data/pull/8) so that readers expecting a DICOM Part 10 file accept it; the 527166 bytes that follow are identical to lorensen/VTKExamples `src/Testing/Data/prostate.img` and hash to VTK's `Testing/Data/dicom/prostate.IMG.sha512` content link."
notes = """
This is human patient imaging, and the file says so itself. Its header records
`InstitutionName` "MEML. SLOAN-KETTERING", `Manufacturer` "Marconi Medical
Systems, Inc.", model IQXTRA, `Modality` CT, `ProtocolName` PELVIS and a
`StudyDate` in 1998. `PatientName` and `PatientID` hold an eight-character
study code and a five-digit number rather than a name, `PatientSex` is
populated, and the birth date, age and accession number are empty, so it is
pseudonymised rather than fully de-identified: the institution and the exact
acquisition date remain in the file.

The trail: the identical bytes (git blob a443e583) were already in Bill
Lorensen's lorensen/VTKWikiExamples at its first GitHub commit on 2015-04-16
(`Testing/Data/prostate.img`, commit 7e43fa5526, itself moved from
gitorious), went with his examples into lorensen/VTKExamples in 2017, and
arrived here with the April 2019 VTK Examples import. VTK has also shipped
the same bytes since November 2016 as `Testing/Data/dicom/prostate.IMG`
(commit 9aa7a81fa0, "Add test to check vtkDICOMImageReader class", which
names no source):

    tail -c +133 prostate.img | shasum -a 512

matches that content link. None of these redistributors states terms for the
file, a redistributor cannot license a hospital's patient imaging, and no
consent or release for this scan was found, so the terms are recorded as
undetermined. Downstream users should ask Memorial Sloan Kettering Cancer
Center or substitute another image.

The description previously called it a raw greyscale slice; it is DICOM, and
the `.img` extension is misleading.
"""

