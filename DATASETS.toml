]
notes = """
`neghip.slc` is in the 2013 VTKData tree this repository was created from;
Bill Lorensen added it to VTKData in August 2001 (commit c010a99 in this
repository's history) and VTK still distributes the same bytes through
`Testing/Data/neghip.slc.sha512`. The same volume is published by Open
SciVis Datasets as `Neghip`, 64 by 64 by 64 uint8, whose entry in
http://klacansky.com/open-scivis-datasets/datasets.json acknowledges
"volvis.org and VolVis distribution of SUNY Stony Brook, NY, USA", cites the
VolVis paper (Avila et al., Visualization '94, doi
10.1109/VISUAL.1994.346340) and describes it as a simulation of the spatial
probability distribution of the electrons in a high potential protein
molecule. Our file is that volume zero-padded to 66 cubed: read `neghip.slc`
with `vtkSLCReader` and
http://klacansky.com/open-scivis-datasets/neghip/neghip_64x64x64_uint8.raw
with numpy; the inner 64 cubed is equal and the one-voxel border sums to
zero. volvis.org is now a parked domain, so Open SciVis is the furthest
upstream point that can be opened; the VolVis origin is its statement, hence
inferred. The VTK textbook credits its iron protein figures to Scripps
Clinic, La Jolla (`src/VTKBook/07Chapter7.md`, Figure 7-4); that credit is
attached to `ironProt.vtk`, not to this file, so Scripps is not recorded as
the origin here. Neither VolVis nor Open SciVis states terms for the volume,
so the licence is undetermined; a downstream user should ask the originating
group before redistributing it. lorensen/VTKExamples carries the same blob
at `src/Testing/Data/neghip.slc`.
"""

